<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q19 - Photo Grid</title>
<style>
  .gallery {
    /* Write your CSS here */
    display: grid;
    gap: 10px;
    grid-template-columns: 1fr 1fr;
  }
  .photo {
    background: #4f46e5;
    color: white;
    display: grid;
    place-items: center;
    height: 100px;
  }
</style>
</head>
<body>
  <div class="gallery">
    <div class="photo">1</div>
    <div class="photo">2</div>
    <div class="photo">3</div>
    <div class="photo">4</div>
  </div>
</body>
</html>
