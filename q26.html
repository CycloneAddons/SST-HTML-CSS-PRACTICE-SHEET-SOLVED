<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q26 - Responsive Flex Columns</title>
<style>
  .container {
    display: flex;
    flex-wrap: wrap;
  }
  .box {
    background: #4f46e5;
    color: white;
    padding: 20px;
    margin: 10px;
    flex: 1 1 30%;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>
</body>
</html>
