<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        html {
            background-color: rgb(29, 29, 29);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 20px;
        }
        .container {
            margin-left: 15px;
            margin-right: 15px;

            
            height: 790px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            text-align: center;
            /* justify-content:space-evenly; */
            font-weight: 600;
        }

        .items {
            border: 2px solid white;
            border-radius: 25px;
                display: flex;
    justify-content: center;
    align-items: center;
        }

        .navbar {
            grid-column: 1/5;
            background-color: brown;
        }

        .sidebar {
            background-color: cadetblue;
        }

        .content, .sidebar {
            grid-row: 2/6;

        }

        .content {
            grid-column: 2/5;
            background-color: rgb(98, 72, 29);
        }

        .footer {
            background-color: rgb(62, 106, 17);
            grid-column: 1/5;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="items navbar"> navbar</div>
        <div class="items content">content</div>
        <div class="items sidebar">sidebar</div>
        <div class="items footer">footer</div>
    </div>
    
</body>
</html>
